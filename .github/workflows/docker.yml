name: Docker pacman

on:
  pull_request:
  workflow_dispatch:
    inputs:
      image:
        description: Container image to test
        type: string
        default: mcr.microsoft.com/windows/servercore:ltsc2022
      isolation:
        description: Docker container isolation mode (process or hyperv)
        type: string
        default: process
      msys2-2022:
        description: Test the December 2022 MSYS2 base with its archived 3.4.2 runtime
        type: boolean
        default: false
      sdk-ref:
        description: Complete Git SDK snapshot to test with dynamicbase off and on
        type: string
        default: ''
      runtime-repository:
        description: Runtime source repository (empty uses this repository)
        type: string
        default: ''
      runtime-ref:
        description: Runtime source ref to build (empty uses the released runtime)
        type: string
        default: ''
      dynamicbase:
        description: Enable dynamicbase when building the runtime
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pacman:
    runs-on: windows-2022
    timeout-minutes: ${{ (inputs.sdk-ref != '' || inputs.msys2-2022) && 20 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON((inputs.sdk-ref != '' || inputs.msys2-2022) && '["0", "1"]' || '["installed"]') }}
    env:
      IMAGE: ${{ inputs.image || 'mcr.microsoft.com/windows/servercore:ltsc2022' }}
      ISOLATION: ${{ inputs.isolation || 'process' }}

    steps:
      - name: Validate runtime selection
        if: >-
          (inputs.sdk-ref != '' && inputs.runtime-ref != '') ||
          (inputs.msys2-2022 && (inputs.sdk-ref != '' || inputs.runtime-ref != ''))
        shell: pwsh
        run: throw 'Select only one historical installation or source build'

      - name: Checkout runtime sources
        if: inputs.runtime-ref != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.runtime-repository || github.repository }}
          ref: ${{ inputs.runtime-ref }}

      - name: Preserve historical SDK line endings
        if: inputs.sdk-ref != ''
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checkout the complete historical Git SDK
        if: inputs.sdk-ref != ''
        uses: actions/checkout@v7
        with:
          repository: git-for-windows/git-sdk-64
          ref: ${{ inputs.sdk-ref }}
          path: sdk
          persist-credentials: false

      - name: Set up the current MSYS2 runtime
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            ${{ inputs.runtime-ref != '' &&
                'base-devel autotools cocom gcc gettext-devel git libiconv-devel perl zlib-devel libzstd-devel'
                || ((inputs.sdk-ref != '' || inputs.msys2-2022) && 'binutils rebase' || '') }}

      - name: Pull Server Core
        shell: pwsh
        run: |
          docker pull $env:IMAGE
          $pullExitCode = $LASTEXITCODE
          if ($pullExitCode -ne 0) {
            $service = Get-Service -Name docker -ErrorAction Stop
            if ($service.Status -ne 'Stopped') { exit $pullExitCode }
            Write-Host 'Docker is stopped; starting it before retrying the image pull.'
            Start-Service -Name docker -ErrorAction Stop
            $deadline = (Get-Date).AddSeconds(60)
            do {
              $info = docker info 2>&1
              if ($LASTEXITCODE -eq 0) { break }
              if ((Get-Date) -ge $deadline) {
                throw "Docker was not ready within 60 seconds: $($info -join [Environment]::NewLine)"
              }
              Start-Sleep -Seconds 2
            } while ($true)
            docker pull $env:IMAGE
            $pullExitCode = $LASTEXITCODE
          }
          if ($pullExitCode -ne 0) { exit $pullExitCode }
          docker image inspect $env:IMAGE --format '{{json .RepoDigests}}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare the complete December 2022 MSYS2 installation
        if: inputs.msys2-2022
        shell: msys2 {0}
        run: |
          fetch() {
            curl --fail --silent --show-error --location "$1" -o "$2"
            printf '%s  %s\n' "$3" "$2" | sha256sum -c -
          }
          mkdir -p sdk packages
          fetch \
            https://github.com/msys2/msys2-installer/releases/download/2022-12-16/msys2-base-x86_64-20221216.tar.xz \
            msys2-20221216.tar.xz \
            246177c84f42fdad0a4ebad53af2e0dd6f29b61463d91c52ebd3d0b0d916ecd1
          fetch \
            https://github.com/msys2/msys2-archive/releases/download/2022-12-16-msys-x86_64/msys2-runtime-3.4-3.4.2-1-x86_64.pkg.tar.zst \
            packages/runtime.pkg.tar.zst \
            c167b9f53057bb2b87b8581c7f821eccdc8bdd4ccfed64eac0e4b3aa2e6dd7ad
          fetch \
            https://github.com/msys2/msys2-archive/releases/download/2022-12-16-msys-x86_64/msys2-keyring-1.20221024-1-any.pkg.tar.zst \
            packages/keyring.pkg.tar.zst \
            e90fb4413f6056dbc8b2df9eac670924aa2851151bc97569e7df12c928acc209
          tar -xf msys2-20221216.tar.xz -C sdk --strip-components=1
          tar -xf packages/runtime.pkg.tar.zst -C sdk usr
          printf '%s  %s\n' \
            eda9f89e032b2d1486c2bb3a66b01c9bae30372a7ff7c3bf16b364ea93b17ef4 \
            sdk/usr/bin/msys-2.0.dll | sha256sum -c -
          sed 's/^[[:space:]]*SigLevel[[:space:]]*=.*/SigLevel = Never/' \
            sdk/etc/pacman.conf > sdk/etc/pacman-ci.conf

      - name: Prepare historical runtime DLLs
        if: inputs.sdk-ref != '' || inputs.msys2-2022
        shell: msys2 {0}
        env:
          SDK_REF: ${{ inputs.sdk-ref }}
          VARIANT: ${{ matrix.variant }}
        run: |
          echo "Historical source: ${SDK_REF:-December 2022 MSYS2 base}"
          dll=sdk/usr/bin/msys-2.0.dll
          cp "$dll" sdk-runtime-original.dll
          peflags -d "$dll"
          peflags -d"$VARIANT" -d "$dll"
          objdump -p "$dll" > sdk-runtime-headers.txt
          sed 's/^[[:space:]]*SigLevel[[:space:]]*=.*/SigLevel = Never/' \
            sdk/etc/pacman.conf > sdk/etc/pacman-ci.conf
          if test "$VARIANT" = 1
          then
            grep -q DYNAMIC_BASE sdk-runtime-headers.txt
          elif grep -q DYNAMIC_BASE sdk-runtime-headers.txt
          then
            echo 'The control DLL unexpectedly enables dynamicbase' >&2
            exit 1
          fi
          sha256sum "$dll" sdk/usr/bin/pacman.exe sdk/usr/bin/sh.exe
          if test -d packages
          then
            tar -cf packages/sdk.tar -C sdk .
          fi

      - name: Upload historical SDK runtime DLLs
        if: inputs.sdk-ref != '' || inputs.msys2-2022
        uses: actions/upload-artifact@v7
        with:
          name: docker-sdk-runtime-${{ matrix.variant }}
          path: |
            sdk/usr/bin/msys-2.0.dll
            sdk-runtime-original.dll
            sdk-runtime-headers.txt
          if-no-files-found: error

      - name: Build the runtime DLL
        if: inputs.runtime-ref != ''
        shell: msys2 {0}
        env:
          DYNAMICBASE: ${{ inputs.dynamicbase }}
        run: |
          git rev-parse HEAD
          (cd winsup && ./autogen.sh)
          ./configure --disable-dependency-tracking --disable-doc \
            --with-cross-bootstrap --with-msys2-runtime-commit="$(git rev-parse HEAD)"
          make -j8 all-target-newlib configure-target-winsup
          flags='-g -O2 -Wl,--disable-dynamicbase'
          if test "$DYNAMICBASE" = true
          then
            flags='-g -O2 -Wl,--dynamicbase'
          fi
          make -C x86_64-pc-cygwin/winsup/cygwin -j8 \
            CXXFLAGS="$flags" all
          dll=x86_64-pc-cygwin/winsup/cygwin/new-msys-2.0.dll
          objdump -p "$dll" > dll-headers.txt
          cat dll-headers.txt
          if test "$DYNAMICBASE" = true
          then
            grep -q DYNAMIC_BASE dll-headers.txt
          elif grep -q DYNAMIC_BASE dll-headers.txt
          then
            echo 'The control DLL unexpectedly enables dynamicbase' >&2
            exit 1
          fi

      - name: Upload the runtime DLL
        if: inputs.runtime-ref != ''
        uses: actions/upload-artifact@v7
        with:
          name: docker-runtime
          path: |
            x86_64-pc-cygwin/winsup/cygwin/new-msys-2.0.dll
            dll-headers.txt
          if-no-files-found: error

      - name: Use the built runtime
        if: inputs.runtime-ref != ''
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          Copy-Item x86_64-pc-cygwin\winsup\cygwin\new-msys-2.0.dll `
            "${env:MSYS2_LOCATION}\usr\bin\msys-2.0.dll"
          Get-FileHash "${env:MSYS2_LOCATION}\usr\bin\msys-2.0.dll"

      - name: Prepare runtime for Docker
        id: runtime
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          SDK_REF: ${{ inputs.sdk-ref }}
          MSYS2_2022: ${{ inputs.msys2-2022 }}
          VARIANT: ${{ matrix.variant }}
        run: |
          Write-Host "Testing runtime variant: $env:VARIANT"
          $location = $env:MSYS2_LOCATION
          if ($env:SDK_REF -or $env:MSYS2_2022 -eq 'true') {
            $location = Join-Path $env:GITHUB_WORKSPACE 'sdk'
            if ($env:SDK_REF) {
              $changes = @(git -C $location diff --name-only)
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $unexpected = @($changes | Where-Object { $_ -ne 'usr/bin/msys-2.0.dll' })
              if ($unexpected.Count -ne 0) {
                throw "Unexpected SDK changes: $($unexpected -join ', ')"
              }
            }
            $expected = [IO.File]::ReadAllBytes(
              (Join-Path $env:GITHUB_WORKSPACE 'sdk-runtime-original.dll'))
            if ($expected.Length -lt 0x40) { throw 'Invalid original runtime DLL' }
            $peOffset = [BitConverter]::ToInt32($expected, 0x3c)
            $flagOffset = $peOffset + 24 + 70
            if ($peOffset -lt 0 -or $flagOffset -ge $expected.Length -or
                [BitConverter]::ToUInt32($expected, $peOffset) -ne 0x4550) {
              throw 'Invalid original runtime PE header'
            }
            $expected[$flagOffset] = $expected[$flagOffset] -band 0xbf
            if ($env:VARIANT -eq '1') {
              $expected[$flagOffset] = $expected[$flagOffset] -bor 0x40
            }
            $expectedHash = [Convert]::ToHexString(
              [Security.Cryptography.SHA256]::HashData($expected))
            $actualHash = (Get-FileHash "$location\usr\bin\msys-2.0.dll").Hash
            if ($actualHash -ne $expectedHash) {
              throw 'The runtime DLL differs by more than the requested dynamicbase bit'
            }
          }
          Get-FileHash "$location\usr\bin\msys-2.0.dll"
          "location=$location" >> $env:GITHUB_OUTPUT

      - name: Check historical pacman startup
        if: inputs.sdk-ref != '' || inputs.msys2-2022
        timeout-minutes: 4
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.runtime.outputs.location }}
        run: |
          docker run --rm --isolation=$env:ISOLATION --user ContainerAdministrator `
            -v "${env:MSYS2_LOCATION}:C:\msys64" `
            -e MSYSTEM=MSYS `
            -e 'PATH=C:\msys64\usr\bin;C:\Windows\System32;C:\Windows' `
            $env:IMAGE C:\msys64\usr\bin\pacman.exe --version
          exit $LASTEXITCODE

      - name: Update MSYS2 in Docker
        if: '!inputs.msys2-2022'
        timeout-minutes: 4
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.runtime.outputs.location }}
          SDK_REF: ${{ inputs.sdk-ref }}
        run: |
          if ($env:SDK_REF) {
            $command = @('C:\msys64\usr\bin\pacman.exe',
              '--config', '/etc/pacman-ci.conf', '-Syu', '--noconfirm')
          } else {
            $command = @('C:\msys64\usr\bin\bash.exe', '--login', '-c',
              'uname -a && pacman --version && pacman -Q msys2-runtime pacman && pacman -Syu --noconfirm')
          }
          docker run --rm --isolation=$env:ISOLATION --user ContainerAdministrator `
            -v "${env:MSYS2_LOCATION}:C:\msys64" `
            -e MSYSTEM=MSYS -e CHERE_INVOKING=1 `
            -e 'PATH=C:\msys64\usr\bin;C:\Windows\System32;C:\Windows' `
            $env:IMAGE @command
          exit $LASTEXITCODE

      - name: Exercise historical pacman scriptlets
        if: inputs.sdk-ref != '' || inputs.msys2-2022
        timeout-minutes: 5
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.runtime.outputs.location }}
          MSYS2_2022: ${{ inputs.msys2-2022 }}
        run: |
          $dll = "${env:MSYS2_LOCATION}\usr\bin\msys-2.0.dll"
          $before = (Get-FileHash $dll).Hash
          $isolations = @($env:ISOLATION)
          $mounts = @('-v', "${env:MSYS2_LOCATION}:C:\msys64")
          $command = @(
            'C:\msys64\usr\bin\pacman.exe',
            '--config', '/etc/pacman-ci.conf',
            '--debug', '-S', '--noconfirm', 'msys2-keyring'
          )
          if ($env:MSYS2_2022 -eq 'true') {
            $isolations = @('process', 'hyperv')
            $packages = Join-Path $env:GITHUB_WORKSPACE 'packages'
            $mounts = @('-v', "${packages}:C:\packages:ro")
            $command = @(
              'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe',
              '-NoProfile', '-Command',
              "New-Item -ItemType Directory -Path C:\msys64 -Force > `$null; C:\Windows\System32\tar.exe -xf C:\packages\sdk.tar -C C:\msys64; if (`$LASTEXITCODE -ne 0) { exit `$LASTEXITCODE }; C:\msys64\usr\bin\bash.exe -lc 'pacman --config /etc/pacman-ci.conf --debug -U --noconfirm /c/packages/keyring.pkg.tar.zst; ret=`$?; gpgconf --kill all >/dev/null 2>&1 || true; exit `$ret'; if (`$LASTEXITCODE -ne 0) { exit `$LASTEXITCODE }; if ((Get-FileHash C:\msys64\usr\bin\msys-2.0.dll).Hash -ne '$before') { throw 'The transaction replaced the runtime DLL under test' }"
            )
          }
          foreach ($iso in $isolations) {
            $log = "sdk-fork-transaction-$iso.log"
            Write-Host "Running transaction with isolation=$iso"
            docker run --rm --isolation=$iso --user ContainerAdministrator `
              @mounts `
              -e MSYSTEM=MSYS `
              -e 'PATH=C:\msys64\usr\bin;C:\Windows\System32;C:\Windows' `
              $env:IMAGE @command `
              2>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE
            if ((Get-FileHash $dll).Hash -ne $before) {
              throw 'The transaction replaced the runtime DLL under test'
            }
            if (Select-String -Path $log `
                -Pattern 'child_copy:|dofork:|child_info_fork::abort|fork: retry') {
              throw "The historical runtime reported a fork failure (isolation=$iso)"
            }
            if ($code -ne 0) { exit $code }
            if (-not (Select-String -Path $log `
                -Pattern 'debug: executing.*(sh|bash)')) {
              throw "The transaction did not reach the shell scriptlet fork path (isolation=$iso)"
            }
          }

      - name: Upload historical fork transaction log
        if: always() && (inputs.sdk-ref != '' || inputs.msys2-2022)
        uses: actions/upload-artifact@v7
        with:
          name: docker-fork-log-${{ matrix.variant }}
          path: sdk-fork-transaction-*.log
          if-no-files-found: warn
