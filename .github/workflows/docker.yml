name: Docker pacman

on:
  pull_request:
  workflow_dispatch:
    inputs:
      sdk-ref:
        description: Complete Git SDK snapshot to test with dynamicbase off and on
        type: string
        default: ''
      runtime-repository:
        description: Runtime source repository (empty uses this repository)
        type: string
        default: ''
      runtime-ref:
        description: Runtime source ref to build (empty uses the released runtime)
        type: string
        default: ''
      dynamicbase:
        description: Enable dynamicbase when building the runtime
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pacman:
    runs-on: windows-2022
    timeout-minutes: ${{ inputs.sdk-ref != '' && 8 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.sdk-ref != '' && '["0", "1"]' || '["installed"]') }}
    env:
      IMAGE: mcr.microsoft.com/windows/servercore:ltsc2022

    steps:
      - name: Validate runtime selection
        if: inputs.sdk-ref != '' && inputs.runtime-ref != ''
        shell: pwsh
        run: throw 'Select either an SDK DLL or a source build, not both'

      - name: Checkout runtime sources
        if: inputs.runtime-ref != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.runtime-repository || github.repository }}
          ref: ${{ inputs.runtime-ref }}

      - name: Preserve historical SDK line endings
        if: inputs.sdk-ref != ''
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checkout the complete historical Git SDK
        if: inputs.sdk-ref != ''
        uses: actions/checkout@v7
        with:
          repository: git-for-windows/git-sdk-64
          ref: ${{ inputs.sdk-ref }}
          path: sdk
          persist-credentials: false

      - name: Set up the current MSYS2 runtime
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            ${{ inputs.runtime-ref != '' &&
                'base-devel autotools cocom gcc gettext-devel git libiconv-devel perl zlib-devel libzstd-devel'
                || (inputs.sdk-ref != '' && 'binutils rebase' || '') }}

      - name: Pull Server Core
        shell: pwsh
        run: |
          docker pull $env:IMAGE
          $pullExitCode = $LASTEXITCODE
          if ($pullExitCode -ne 0) {
            $service = Get-Service -Name docker -ErrorAction Stop
            if ($service.Status -ne 'Stopped') { exit $pullExitCode }
            Write-Host 'Docker is stopped; starting it before retrying the image pull.'
            Start-Service -Name docker -ErrorAction Stop
            $deadline = (Get-Date).AddSeconds(60)
            do {
              $info = docker info 2>&1
              if ($LASTEXITCODE -eq 0) { break }
              if ((Get-Date) -ge $deadline) {
                throw "Docker was not ready within 60 seconds: $($info -join [Environment]::NewLine)"
              }
              Start-Sleep -Seconds 2
            } while ($true)
            docker pull $env:IMAGE
            $pullExitCode = $LASTEXITCODE
          }
          if ($pullExitCode -ne 0) { exit $pullExitCode }
          docker image inspect $env:IMAGE --format '{{json .RepoDigests}}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare historical SDK runtime DLLs
        if: inputs.sdk-ref != ''
        shell: msys2 {0}
        env:
          SDK_REF: ${{ inputs.sdk-ref }}
          VARIANT: ${{ matrix.variant }}
        run: |
          echo "Git SDK source: $SDK_REF"
          dll=sdk/usr/bin/msys-2.0.dll
          peflags -d "$dll"
          peflags -d"$VARIANT" -d "$dll"
          objdump -p "$dll" > sdk-runtime-headers.txt
          if test "$VARIANT" = 1
          then
            grep -q DYNAMIC_BASE sdk-runtime-headers.txt
          elif grep -q DYNAMIC_BASE sdk-runtime-headers.txt
          then
            echo 'The control DLL unexpectedly enables dynamicbase' >&2
            exit 1
          fi
          sha256sum "$dll" sdk/usr/bin/pacman.exe sdk/usr/bin/sh.exe

      - name: Upload historical SDK runtime DLLs
        if: inputs.sdk-ref != ''
        uses: actions/upload-artifact@v7
        with:
          name: docker-sdk-runtime-${{ matrix.variant }}
          path: |
            sdk/usr/bin/msys-2.0.dll
            sdk-runtime-headers.txt
          if-no-files-found: error

      - name: Build the runtime DLL
        if: inputs.runtime-ref != ''
        shell: msys2 {0}
        env:
          DYNAMICBASE: ${{ inputs.dynamicbase }}
        run: |
          git rev-parse HEAD
          (cd winsup && ./autogen.sh)
          ./configure --disable-dependency-tracking --disable-doc \
            --with-cross-bootstrap --with-msys2-runtime-commit="$(git rev-parse HEAD)"
          make -j8 all-target-newlib configure-target-winsup
          flags='-g -O2 -Wl,--disable-dynamicbase'
          if test "$DYNAMICBASE" = true
          then
            flags='-g -O2 -Wl,--dynamicbase'
          fi
          make -C x86_64-pc-cygwin/winsup/cygwin -j8 \
            CXXFLAGS="$flags" all
          dll=x86_64-pc-cygwin/winsup/cygwin/new-msys-2.0.dll
          objdump -p "$dll" > dll-headers.txt
          cat dll-headers.txt
          if test "$DYNAMICBASE" = true
          then
            grep -q DYNAMIC_BASE dll-headers.txt
          elif grep -q DYNAMIC_BASE dll-headers.txt
          then
            echo 'The control DLL unexpectedly enables dynamicbase' >&2
            exit 1
          fi

      - name: Upload the runtime DLL
        if: inputs.runtime-ref != ''
        uses: actions/upload-artifact@v7
        with:
          name: docker-runtime
          path: |
            x86_64-pc-cygwin/winsup/cygwin/new-msys-2.0.dll
            dll-headers.txt
          if-no-files-found: error

      - name: Use the built runtime
        if: inputs.runtime-ref != ''
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          Copy-Item x86_64-pc-cygwin\winsup\cygwin\new-msys-2.0.dll `
            "${env:MSYS2_LOCATION}\usr\bin\msys-2.0.dll"
          Get-FileHash "${env:MSYS2_LOCATION}\usr\bin\msys-2.0.dll"

      - name: Prepare runtime for Docker
        id: runtime
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          SDK_REF: ${{ inputs.sdk-ref }}
          VARIANT: ${{ matrix.variant }}
        run: |
          Write-Host "Testing runtime variant: $env:VARIANT"
          $location = $env:MSYS2_LOCATION
          if ($env:SDK_REF) {
            $location = Join-Path $env:GITHUB_WORKSPACE 'sdk'
            $changes = @(git -C $location diff --name-only)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($env:VARIANT -eq '0' -and $changes.Count -ne 0) {
              throw 'The control SDK differs from its historical snapshot'
            }
            if ($env:VARIANT -eq '1' -and
                ($changes.Count -ne 1 -or $changes[0] -ne 'usr/bin/msys-2.0.dll')) {
              throw 'Only the runtime DLL may differ from the historical snapshot'
            }
          }
          Get-FileHash "$location\usr\bin\msys-2.0.dll"
          "location=$location" >> $env:GITHUB_OUTPUT

      - name: Check historical pacman startup
        if: inputs.sdk-ref != ''
        timeout-minutes: 2
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.runtime.outputs.location }}
        run: |
          docker run --rm --user ContainerAdministrator `
            -v "${env:MSYS2_LOCATION}:C:\msys64" `
            -e MSYSTEM=MSYS `
            -e 'PATH=C:\msys64\usr\bin;C:\Windows\System32;C:\Windows' `
            $env:IMAGE C:\msys64\usr\bin\pacman.exe --version
          exit $LASTEXITCODE

      - name: Update MSYS2 in Docker
        timeout-minutes: 3
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.runtime.outputs.location }}
          SDK_REF: ${{ inputs.sdk-ref }}
        run: |
          if ($env:SDK_REF) {
            $command = @('C:\msys64\usr\bin\pacman.exe', '-Syu', '--noconfirm')
          } else {
            $command = @('C:\msys64\usr\bin\bash.exe', '--login', '-c',
              'uname -a && pacman --version && pacman -Q msys2-runtime pacman && pacman -Syu --noconfirm')
          }
          docker run --rm --user ContainerAdministrator `
            -v "${env:MSYS2_LOCATION}:C:\msys64" `
            -e MSYSTEM=MSYS -e CHERE_INVOKING=1 `
            -e 'PATH=C:\msys64\usr\bin;C:\Windows\System32;C:\Windows' `
            $env:IMAGE @command
          exit $LASTEXITCODE
