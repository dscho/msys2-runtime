name: build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: setup-msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: msys2-devel base-devel autotools cocom diffutils gcc gettext-devel libiconv-devel make mingw-w64-cross-crt mingw-w64-cross-gcc mingw-w64-cross-zlib perl zlib-devel xmlto docbook-xsl libzstd-devel

      - name: Build
        shell: msys2 {0}
        run: |
          set -e -o pipefail
          mkdir -p ci-diagnostics
          {
            gcc --version
            pacman -Q
            (cd winsup && ./autogen.sh)
            ./configure --disable-dependency-tracking --with-msys2-runtime-commit="$GITHUB_SHA"
            make -j8
          } </dev/null 2>&1 | tee ci-diagnostics/build.log

      - name: Install
        shell: msys2 {0}
        run: |
          make DESTDIR="$(pwd)"/_dest install

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: install
          path: _dest/

      - name: Preserve runtime build evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: runtime-build-evidence
          path: ci-diagnostics/
          if-no-files-found: error

  generate-msys2-tests-matrix:
    if: ${{ github.repository != 'dscho/msys2-runtime' || github.ref != 'refs/heads/ci/copilot-msys-gcc-timeout-375-20261003' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        uses: msys2/msys2-tests/gha-matrix-gen@main

  msys2-tests:
    needs: [build, generate-msys2-tests-matrix]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-msys2-tests-matrix.outputs.matrix) }}

    name: msys2-tests ${{ matrix.msystem }}-${{ matrix.cc }}
    runs-on: ${{ matrix.runner }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      FC: ${{ matrix.fc }}
    steps:
      - id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.packages }}

      - name: Add staging repo
        shell: msys2 {0}
        run: |
          sed -i '1s|^|[staging]\nServer = https://repo.msys2.org/staging/\nSigLevel = Never\n|' /etc/pacman.conf

      - name: Update using staging
        shell: pwsh
        run: |
          msys2 -c 'pacman --noconfirm -Suuy'
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          msys2 -c 'pacman --noconfirm -Suu'

      - name: Download msys2-runtime artifact
        uses: actions/download-artifact@v8
        with:
          name: install
          path: ${{ steps.msys2.outputs.msys2-location }}

      - name: uname -a
        shell: msys2 {0}
        run: uname -a

      - name: Run tests
        uses: msys2/msys2-tests@main

  debug-msys-gcc:
    needs: build
    if: ${{ github.repository == 'dscho/msys2-runtime' && github.ref == 'refs/heads/ci/copilot-msys-gcc-timeout-375-20261003' }}
    name: MSYS-gcc signal-counter verification
    runs-on: windows-2025
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
      copilot-requests: write
    env:
      CC: gcc
      CXX: g++
      FC: gfortran
      RUNTIME: counter-preservation
      EXPECTED_BASE: '0000000180040000'
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v7

      - name: Checkout pinned msys2-tests
        uses: actions/checkout@v7
        with:
          repository: msys2/msys2-tests
          ref: a5a6995b100ef2b09cd96b4c6262a573840b3af9
          path: msys2-tests

      - name: Initialize live capture evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ci-diagnostics | Out-Null
          @(
            "runtime=$env:RUNTIME"
            "workflow_revision=$env:GITHUB_SHA"
            "candidate_revision=$env:GITHUB_SHA"
            'control_revision=0eed0a44c3b8366ea17b2f0ddca0c2d0eeb429a7'
            'control_artifact=msys2/msys2-runtime/37015007624/install'
            'tests_revision=a5a6995b100ef2b09cd96b4c6262a573840b3af9'
            "runner_image=$env:ImageOS"
            "runner_image_version=$env:ImageVersion"
          ) | Set-Content ci-diagnostics/provenance.log
          @(
            '# MSYS-gcc signal-counter verification'
            ''
            'No test outcome has been established yet.'
            'The rebuilt counter correction and original CMake 4.4.3 are selected.'
            'The original runtime artifact is retained for isolated control probes.'
          ) | Set-Content ci-diagnostics/copilot-diagnosis.md

      - id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MSYS
          update: true
          install: meson ninja cmake make gcc python python-setuptools python-setuptools-rust cython autotools ruby perl mingw-w64-cross-gcc mingw-w64-cross-mingwarm64-gcc gdb git asciidoctor gettext-devel zsh fish rust openssh patch

      - name: Add staging repo
        shell: msys2 {0}
        run: |
          sed -i '1s|^|[staging]\nServer = https://repo.msys2.org/staging/\nSigLevel = Never\n|' /etc/pacman.conf

      - name: Update using staging
        shell: pwsh
        run: |
          msys2 -c 'pacman --noconfirm -Suuy'
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          msys2 -c 'pacman --noconfirm -Suu'

      - name: Reuse the original failing-run runtime artifact
        uses: actions/download-artifact@v8
        with:
          name: install
          repository: msys2/msys2-runtime
          run-id: 37015007624
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ci-diagnostics/control-runtime

      - name: Install the rebuilt counter correction
        uses: actions/download-artifact@v8
        with:
          name: install
          path: ${{ steps.msys2.outputs.msys2-location }}

      - name: Restore the original CMake version
        timeout-minutes: 2
        shell: msys2 {0}
        run: |
          set -e -o pipefail
          pacman --noconfirm -U \
            https://repo.msys2.org/msys/x86_64/cmake-4.4.3-1-x86_64.pkg.tar.zst \
            </dev/null 2>&1 | tee ci-diagnostics/cmake-install.log
          test "$(pacman -Q cmake)" = 'cmake 4.4.3-1'

      - name: Verify selected runtime and base address
        timeout-minutes: 2
        shell: msys2 {0}
        run: |
          set -e -o pipefail
          {
            uname -a
            cmake --version
            sha256sum /usr/bin/msys-2.0.dll
            pacman -Q
          } </dev/null 2>&1 | tee ci-diagnostics/runtime.log
          objdump -p /usr/bin/msys-2.0.dll > ci-diagnostics/runtime-pe.log
          image_base=$(sed -n 's/^ImageBase[[:space:]]*//p' ci-diagnostics/runtime-pe.log)
          printf 'ImageBase=%s expected=%s\n' "$image_base" "$EXPECTED_BASE" \
            | tee -a ci-diagnostics/runtime.log
          test "$image_base" = "$EXPECTED_BASE"

      - name: Prepare the original test action path
        timeout-minutes: 2
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $root = (Resolve-Path ci-diagnostics).Path
          $tests = Join-Path (Split-Path $env:RUNNER_TEMP -Parent) '_actions/msys2/msys2-tests/main'
          if (Test-Path -LiteralPath $tests) {
            throw "Refusing to overwrite an existing action directory: $tests"
          }
          $revision = (git -C msys2-tests rev-parse HEAD).Trim()
          if ($revision -ne 'a5a6995b100ef2b09cd96b4c6262a573840b3af9') {
            throw "Unexpected test revision: $revision"
          }
          git -c core.autocrlf=false -C msys2-tests archive --format=tar --output="$root/msys2-tests.tar" $revision
          New-Item -ItemType Directory -Path $tests -Force | Out-Null
          & "$env:MSYS2_ROOT/usr/bin/bsdtar.exe" -xf "$root/msys2-tests.tar" -C $tests
          "MSYS2_TESTS=$tests" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          @("tests_action_path=$tests", "tests_archive_revision=$revision") |
            Tee-Object -FilePath "$root/provenance.log" -Append

      - name: Run CMake prerequisites
        id: prerequisites
        timeout-minutes: 8
        shell: msys2 {0}
        run: |
          set -e -o pipefail
          tests=$(cygpath -u "$MSYS2_TESTS")
          for target in toolchain rust python; do
            (
              . "$tests/group_helper.sh" "test: $target"
              make -C "$tests" -j "$target"
            ) </dev/null 2>&1 | tee "ci-diagnostics/${target}.log"
          done

      - name: Set up Copilot CLI
        if: ${{ always() && steps.prerequisites.outcome == 'success' }}
        timeout-minutes: 3
        shell: bash
        run: |
          npm install -g @github/copilot </dev/null 2>&1 | tee ci-diagnostics/copilot-install.log

      - name: Reuse the validated native trace controller
        if: ${{ always() && steps.prerequisites.outcome == 'success' }}
        timeout-minutes: 3
        uses: actions/download-artifact@v8
        with:
          name: msys-gcc-live-hang
          repository: dscho/msys2-runtime
          run-id: 37336886615
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ci-diagnostics/prior-control

      - name: Compile the signal-counter regressions
        id: compile-counter
        if: ${{ always() && steps.prerequisites.outcome == 'success' }}
        timeout-minutes: 2
        shell: msys2 {0}
        run: |
          set -e -o pipefail
          mkdir -p ci-diagnostics/counter-probes/fixed
          {
            gcc -g -O0 -Wall -Wextra ci-diagnostics/prior-control/once-probe.c \
              -o ci-diagnostics/counter-probes/fixed/once-probe.exe
            for test in once1 once2; do
              gcc -g -O0 "winsup/testsuite/winsup.api/pthread/$test.c" \
                -o "ci-diagnostics/counter-probes/fixed/$test.exe"
            done
            sha256sum ci-diagnostics/prior-control/once-probe.c \
              winsup/testsuite/winsup.api/pthread/once{1,2}.c \
              ci-diagnostics/counter-probes/fixed/*.exe
          } </dev/null 2>&1 | tee ci-diagnostics/counter-compile.log

      - name: Compare original and corrected signal nesting
        id: counter
        if: ${{ always() && steps.compile-counter.outcome == 'success' }}
        timeout-minutes: 4
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:MSYSTEM = 'MSYS'
          $root = (Resolve-Path ci-diagnostics).Path
          $fixed = Join-Path $root 'counter-probes/fixed'
          $control = Join-Path $root 'counter-probes/control'
          New-Item -ItemType Directory -Path $control | Out-Null
          Copy-Item "$fixed/*.exe" -Destination $control
          Copy-Item "$env:MSYS2_ROOT/usr/bin/msys-2.0.dll" -Destination $fixed
          Copy-Item "$root/control-runtime/usr/bin/msys-2.0.dll" -Destination $control
          $controlHash = (Get-FileHash "$control/msys-2.0.dll").Hash
          if ($controlHash -ne 'cfc995e7946b292debf42ec2b296ee9f4658289f653f7ceb8d9cae18da6d04ad') {
            throw "Unexpected original control DLL: $controlHash"
          }
          $quiet = 'before-once=00000000,init-entry=00000001,init-after=00000001,after-once=00000000'
          $broken = 'before-once=00000000,init-entry=00000001,handler=00000000,init-after=00000000,after-once=ffffffff'
          $balanced = 'before-once=00000000,init-entry=00000001,handler=00000000,init-after=00000001,after-once=00000000'
          $cases = @(
            @{ runtime = 'control'; program = 'once-probe'; arguments = @(); counts = $quiet; modules = $true }
            @{ runtime = 'control'; program = 'once-probe'; arguments = @('signal'); counts = $broken }
            @{ runtime = 'control'; program = 'once1'; arguments = @() }
            @{ runtime = 'control'; program = 'once2'; arguments = @(); regression = $true }
            @{ runtime = 'fixed'; program = 'once-probe'; arguments = @(); counts = $quiet; modules = $true }
            @{ runtime = 'fixed'; program = 'once-probe'; arguments = @('signal'); counts = $balanced }
            @{ runtime = 'fixed'; program = 'once1'; arguments = @() }
            @{ runtime = 'fixed'; program = 'once2'; arguments = @() }
          )
          $records = [Collections.Generic.List[object]]::new()
          try {
            foreach ($case in $cases) {
              $mode = if ($case.program -ne 'once-probe') { 'default' } elseif ($case.arguments.Count) {
                'signal'
              } else { 'quiet' }
              $name = "$($case.runtime)-$($case.program)-$mode"
              $directory = (Resolve-Path (Join-Path $root "counter-probes/$($case.runtime)")).Path
              $stdout = Join-Path $root "counter-probes/$name.stdout.log"
              $stderr = Join-Path $root "counter-probes/$name.stderr.log"
              $info = [Diagnostics.ProcessStartInfo]::new("$directory/$($case.program).exe")
              $info.UseShellExecute = $false
              $info.WorkingDirectory = $directory
              $info.RedirectStandardInput = $true
              $info.RedirectStandardOutput = $true
              $info.RedirectStandardError = $true
              foreach ($argument in $case.arguments) { $info.ArgumentList.Add($argument) }
              $record = [ordered]@{
                name = $name; executable = $info.FileName; arguments = $case.arguments
                startedUtc = [DateTime]::UtcNow.ToString('o'); expectedCounts = $case.counts
                expectedRegressionFailure = [bool]$case.regression; result = 'incomplete'
              }
              $records.Add($record)
              $outFile = [IO.FileStream]::new($stdout, [IO.FileMode]::Create,
                [IO.FileAccess]::Write, [IO.FileShare]::ReadWrite, 1, [IO.FileOptions]::Asynchronous)
              $errFile = [IO.FileStream]::new($stderr, [IO.FileMode]::Create,
                [IO.FileAccess]::Write, [IO.FileShare]::ReadWrite, 1, [IO.FileOptions]::Asynchronous)
              $process = [Diagnostics.Process]::Start($info)
              $record.pid = $process.Id
              $process.StandardInput.Close()
              $outCopy = $process.StandardOutput.BaseStream.CopyToAsync($outFile)
              $errCopy = $process.StandardError.BaseStream.CopyToAsync($errFile)
              try {
                if ($case.modules) {
                  Start-Sleep -Seconds 1
                  $module = @($process.Modules | Where-Object ModuleName -EQ 'msys-2.0.dll')
                  if ($module.Count -ne 1) { throw "No unique loaded runtime for $name" }
                  $record.module = @{
                    path = $module[0].FileName
                    base = '{0:x16}' -f $module[0].BaseAddress.ToInt64()
                    sha256 = (Get-FileHash $module[0].FileName).Hash
                    version = $module[0].FileVersionInfo.FileVersion
                  }
                  if ($record.module.path -ne "$directory\msys-2.0.dll" -or
                      $record.module.base -ne $env:EXPECTED_BASE -or
                      $record.module.sha256 -ne (Get-FileHash "$directory/msys-2.0.dll").Hash) {
                    throw "Unexpected loaded runtime for ${name}: $($record.module | ConvertTo-Json -Compress)"
                  }
                }
              } finally {
                $record.finished = $process.WaitForExit(45000)
                $record.exitCode = if ($record.finished) { $process.ExitCode } else { $null }
                $record.outputComplete = $record.finished -and [Threading.Tasks.Task]::WaitAll(
                  [Threading.Tasks.Task[]]@($outCopy, $errCopy), 5000)
                if ($record.outputComplete) { $outFile.Dispose(); $errFile.Dispose() }
                else { $outFile.Flush(); $errFile.Flush() }
              }
              Get-Content -LiteralPath $stdout
              Get-Content -LiteralPath $stderr
              if (-not $record.finished -or -not $record.outputComplete) {
                throw "Incomplete probe $name; the process and partial output are preserved."
              }
              if ($case.regression) {
                if ($record.exitCode -ne 1 -or -not (Select-String -LiteralPath $stderr -Pattern 'poll after pthread_once.*expected -1/EINTR')) {
                  throw "Original runtime did not fail the expected poll check in $name"
                }
              } elseif ($record.exitCode -ne 0) {
                throw "Probe $name exited $($record.exitCode)"
              }
              if ($case.counts) {
                $samples = @(Select-String -LiteralPath $stdout -Pattern '^(\S+) count=0x([0-9a-f]{8}) qpc=-?[0-9]+$')
                $record.counts = ($samples | ForEach-Object {
                  "$($_.Matches[0].Groups[1].Value)=$($_.Matches[0].Groups[2].Value)"
                }) -join ','
                if ($record.counts -cne $case.counts) {
                  throw "Unexpected nesting in ${name}: $($record.counts)"
                }
              }
              $record.result = 'pass'
            }
          } finally {
            $records | ConvertTo-Json -Depth 8 | Set-Content "$root/counter-probes/results.json"
          }

      - name: Run CMake and investigate with the live watcher
        id: cmake
        if: ${{ always() && steps.prerequisites.outcome == 'success' }}
        timeout-minutes: 40
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          $ErrorActionPreference = 'Stop'
          $env:MSYSTEM = 'MSYS'
          $wrapper = (Get-Command msys2).Source
          $root = (Resolve-Path ci-diagnostics).Path
          $watcherScript = Join-Path $env:GITHUB_WORKSPACE '.github/copilot-prompts/watch-cmake.cjs'
          $watcher = $null
          $failures = [Collections.Generic.List[string]]::new()
          if ('${{ steps.counter.outcome }}' -ne 'success') {
            $failures.Add('Signal-counter verification failed or was skipped; inspect its preserved results.')
          }
          try {
            $targetScript = Join-Path $root 'cmake-target.sh'
            [IO.File]::WriteAllText($targetScript, @'
          tests=$(cygpath -u "$MSYS2_TESTS")
          . "$tests/group_helper.sh" "test: cmake"
          make -C "$tests" -j cmake
          '@, [Text.Encoding]::ASCII)
            $watcher = Start-Process -FilePath (Get-Command node).Source `
              -ArgumentList "`"$watcherScript`" `"$env:MSYS2_ROOT`" `"$root`"" `
              -NoNewWindow -PassThru `
              -RedirectStandardOutput "$root/watcher.stdout.log" `
              -RedirectStandardError "$root/watcher.stderr.log"
            $watcher.Id | Set-Content "$root/watcher.pid"
            $readyDeadline = [DateTime]::UtcNow.AddSeconds(30)
            while (-not (Test-Path "$root/watcher-ready.json")) {
              if ($watcher.HasExited -or [DateTime]::UtcNow -ge $readyDeadline) {
                Get-Content "$root/watcher.stderr.log"
                throw 'CMake watcher did not become ready; evidence saved.'
              }
              Start-Sleep -Seconds 1
              $watcher.Refresh()
            }
            Get-Content "$root/watcher-ready.json"
            $results = Join-Path $root 'cmake-results.csv'
            'attempt,result,exit_code,seconds,ctest_passes' | Set-Content $results
            $attemptDeadline = [DateTime]::UtcNow.AddMinutes(12)
            for ($attempt = 1; $attempt -le 20; $attempt++) {
              $watcher.Refresh()
              if ($watcher.HasExited -or [DateTime]::UtcNow.AddSeconds(120) -ge $attemptDeadline) {
                throw 'Watcher exited or full-target batch deadline reached; evidence saved.'
              }
              $log = Join-Path $root "cmake-$attempt.log"
              $errorLog = Join-Path $root "cmake-$attempt.stderr.log"
              "Starting attempt $attempt at $([DateTime]::UtcNow.ToString('o'))" |
                Tee-Object -FilePath ci-diagnostics/cmake-attempts.log -Append
              $processInfo = [Diagnostics.ProcessStartInfo]::new($env:ComSpec)
              $processInfo.UseShellExecute = $false
              $processInfo.WorkingDirectory = $env:GITHUB_WORKSPACE
              $processInfo.Arguments = '/d /s /c ""{0}" "{1}""' -f $wrapper, $targetScript
              $processInfo.RedirectStandardInput = $true
              $processInfo.RedirectStandardOutput = $true
              $processInfo.RedirectStandardError = $true
              $stdoutLog = [IO.FileStream]::new($log, [IO.FileMode]::Create,
                [IO.FileAccess]::Write, [IO.FileShare]::ReadWrite, 1, [IO.FileOptions]::Asynchronous)
              $stderrLog = [IO.FileStream]::new($errorLog, [IO.FileMode]::Create,
                [IO.FileAccess]::Write, [IO.FileShare]::ReadWrite, 1, [IO.FileOptions]::Asynchronous)
              $timer = [Diagnostics.Stopwatch]::StartNew()
              $process = [Diagnostics.Process]::Start($processInfo)
              $process.StandardInput.Close()
              $stdoutCopy = $process.StandardOutput.BaseStream.CopyToAsync($stdoutLog)
              $stderrCopy = $process.StandardError.BaseStream.CopyToAsync($stderrLog)
              $finished = $process.WaitForExit(120000)
              $outputComplete = $finished -and [Threading.Tasks.Task]::WaitAll(
                [Threading.Tasks.Task[]]@($stdoutCopy, $stderrCopy), 10000)
              $timer.Stop()
              if ($outputComplete) {
                $stdoutLog.Dispose()
                $stderrLog.Dispose()
              }
              $exitCode = if ($finished) { $process.ExitCode } else { $null }
              $passes = @(Select-String -LiteralPath $log -Pattern '^100% tests passed out of 1$').Count
              $result = if (-not $finished) { 'timeout' } elseif (-not $outputComplete) {
                'output-timeout'
              } elseif ($exitCode -ne 0) {
                'failure'
              } elseif ($passes -ne 8) { 'incomplete' } else { 'pass' }
              "$attempt,$result,$exitCode,$([int]$timer.Elapsed.TotalSeconds),$passes" |
                Add-Content $results
              @{
                pid = $process.Id
                executable = $processInfo.FileName
                arguments = $processInfo.Arguments
                script = $targetScript
                outputComplete = $outputComplete
                exitCode = $exitCode
                stdout = $log
                stderr = $errorLog
              } | ConvertTo-Json | Set-Content "$root/cmake-$attempt-process.json"
              Copy-Item -LiteralPath "$env:MSYS2_TESTS/cmake" -Destination "$root/cmake-$attempt-tree" -Recurse
              Get-Content -LiteralPath $log
              Get-Content -LiteralPath $errorLog
              if ($result -ne 'pass') {
                Get-CimInstance Win32_Process -OperationTimeoutSec 10 |
                  Select-Object ProcessId,ParentProcessId,Name,ExecutablePath |
                  Format-List | Out-File "$root/cmake-$attempt-processes.log"
                throw "CMake attempt ${attempt}: $result (exit=$exitCode, CTest passes=$passes/8); evidence saved."
              }
            }
            if (-not (Get-ChildItem -LiteralPath $root -Filter 'hang-*-capture.json')) {
              $watcher.Refresh()
              if ($watcher.HasExited) {
                throw 'Watcher exited before the synthetic check; inspect its saved output.'
              }
              $fixture = Join-Path $root 'watcher-smoke'
              New-Item -ItemType Directory -Path $fixture | Out-Null
              $stdin = Join-Path $fixture 'stdin-empty'
              New-Item -ItemType File -Path $stdin | Out-Null
              $cmakeExe = Join-Path $env:MSYS2_ROOT 'usr/bin/cmake.exe'
              $smoke = Start-Process -FilePath $cmakeExe -ArgumentList '-E sleep 90' `
                -NoNewWindow -PassThru -RedirectStandardInput $stdin `
                -RedirectStandardOutput "$fixture/cmake.stdout.log" `
                -RedirectStandardError "$fixture/cmake.stderr.log"
              @{
                kind = 'Synthetic debugger smoke check, NOT a reproduced hang'
                pid = $smoke.Id
                executable = $cmakeExe
                arguments = '-E sleep 90'
                startedUtc = [DateTime]::UtcNow.ToString('o')
              } | ConvertTo-Json | Set-Content "$fixture/command.json"
              $smokeFinished = $smoke.WaitForExit(120000)
              @{
                finished = $smokeFinished
                exitCode = if ($smokeFinished) { $smoke.ExitCode } else { $null }
                observedUtc = [DateTime]::UtcNow.ToString('o')
              } | ConvertTo-Json | Set-Content "$fixture/result.json"
              if (-not $smokeFinished -or $smoke.ExitCode -ne 0) {
                throw 'Synthetic CMake sleep did not finish normally; inspect smoke evidence.'
              }
              $captureFile = Join-Path $root "hang-$($smoke.Id)-capture.json"
              if (-not (Test-Path $captureFile)) {
                throw 'Watcher did not capture the synthetic CMake sleep; inspect its saved output.'
              }
              $capture = Get-Content $captureFile -Raw | ConvertFrom-Json
              $debuggerLog = Join-Path $root "hang-$($smoke.Id)-debugger.log"
              if ($capture.timedOut -or $capture.code -ne 0 -or
                  $capture.validEvidence -ne $true -or
                  -not (Test-Path $debuggerLog) -or (Get-Item $debuggerLog).Length -eq 0) {
                throw 'Synthetic debugger capture failed; partial evidence is preserved.'
              }
              Get-ChildItem -LiteralPath $root -File | Where-Object {
                $_.Name -eq "hang-$($smoke.Id).json" -or
                $_.Name.StartsWith("hang-$($smoke.Id)-")
              } | Move-Item -Destination $fixture
              Write-Output 'Synthetic debugger output saved separately; inspect stacks and modules before judging capture quality.'
            }
          } catch {
            $failures.Add(($_ | Out-String))
            $_ | Out-String | Tee-Object -FilePath "$root/cmake-step-error.log"
          }
          try {
            if ($failures.Count) {
            $analysisScript = Join-Path $root 'run-copilot.sh'
            [IO.File]::WriteAllText($analysisScript, @'
          if copilot -p "Follow @.github/copilot-prompts/debug-msys-gcc.md exactly." \
            --model gpt-6.1-sol --effort max --context long_context \
            --yolo --no-ask-user --secret-env-vars GH_TOKEN \
            --output-format json </dev/null 2>&1 | tee ci-diagnostics/copilot.log \
            | node .github/copilot-prompts/filter-ci-events.cjs \
            | tee ci-diagnostics/copilot-readable.log; then
            printf '%s\n' 'Copilot exited successfully.' \
              | tee -a ci-diagnostics/copilot.log ci-diagnostics/copilot-readable.log
          else
            status=$?
            printf 'Copilot exited with status %s; partial findings and log are preserved.\n' "$status" \
              | tee -a ci-diagnostics/copilot.log ci-diagnostics/copilot-readable.log
            exit "$status"
          fi
          '@, [Text.Encoding]::ASCII)
            $analysisInfo = [Diagnostics.ProcessStartInfo]::new((Get-Command bash).Source)
            $analysisInfo.UseShellExecute = $false
            $analysisInfo.WorkingDirectory = $env:GITHUB_WORKSPACE
            $analysisInfo.RedirectStandardInput = $true
            $analysisInfo.Environment['MSYSTEM'] = 'MINGW64'
            foreach ($argument in @('--noprofile', '--norc', '-e', '-o', 'pipefail', $analysisScript.Replace('\', '/'))) {
              $analysisInfo.ArgumentList.Add($argument)
            }
            $analysis = [Diagnostics.Process]::Start($analysisInfo)
            $analysis.StandardInput.Close()
            if (-not $analysis.WaitForExit(1500000)) {
              throw 'Copilot exceeded its native 25-minute deadline; partial output is preserved.'
            }
            if ($analysis.ExitCode -ne 0) {
              throw "Copilot exited $($analysis.ExitCode); partial output is preserved."
            }
            } else {
              @(
                '# MSYS-gcc signal-counter verification'
                ''
                'The original control underflowed; the corrected probe preserved nesting.'
                'The public poll regression failed on the original DLL and passed on the corrected DLL.'
                'All 20 unchanged full CMake targets passed: exit 0, complete drains, eight CTest summaries each.'
                'Copilot was not run because verification succeeded.'
                ''
                'See counter-probes/results.json and cmake-results.csv for the measured results.'
              ) | Set-Content "$root/copilot-diagnosis.md"
            }
          } catch {
            $failures.Add(($_ | Out-String))
            $_ | Out-String | Tee-Object -FilePath "$root/copilot-step-error.log"
          } finally {
            New-Item -ItemType File -Path "$root/watcher-stop" -Force | Out-Null
            if ($watcher) {
              if (-not $watcher.WaitForExit(10000)) {
                $failures.Add('Watcher did not finish within 10 seconds; partial output is preserved without killing it.')
              } elseif (-not (Test-Path "$root/watcher-finished.json")) {
                $failures.Add('Watcher exited without a completion record; inspect its saved output.')
              }
            }
            if (Test-Path "$root/watcher-error.log") {
              $failures.Add((Get-Content "$root/watcher-error.log" -Raw))
              Get-Content "$root/watcher-error.log"
            }
          }
          if ($failures.Count) {
            throw ($failures -join "`n")
          }

      - name: Record full-target outcome
        if: ${{ always() && steps.cmake.outcome != 'skipped' }}
        shell: pwsh
        run: |
          @(
            '# MSYS-gcc live hang capture'
            ''
            'An attempt passes only with exit 0 and all eight CTest success lines.'
            'Passing initial attempts do not reproduce the intermittent hang.'
            ''
            '```csv'
          ) | Out-File $env:GITHUB_STEP_SUMMARY -Append
          if (Test-Path -LiteralPath ci-diagnostics/cmake-results.csv) {
            Get-Content ci-diagnostics/cmake-results.csv |
              Tee-Object -FilePath ci-diagnostics/comparison-results.log |
              Out-File $env:GITHUB_STEP_SUMMARY -Append
          } else {
            Write-Warning 'No attempt ledger was created; inspect the CMake step failure.'
            'No attempt ledger was created; inspect the CMake step failure.' |
              Out-File $env:GITHUB_STEP_SUMMARY -Append
          }
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload live capture and Copilot evidence
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@v7
        with:
          name: msys-gcc-live-hang
          path: ci-diagnostics/
          if-no-files-found: error
