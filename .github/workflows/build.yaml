name: copilot-ui-debug

on:
  push:
    branches:
      - copilot-debug-ui-flake
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download known-good runtime artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          repository: git-for-windows/msys2-runtime
          run-id: 29588824862
          name: install
          path: install

      - name: Relay runtime artifact
        uses: actions/upload-artifact@v7
        with:
          name: install
          path: install/

  ui-tests:
    needs: build
    uses: ./.github/workflows/ui-tests.yml
    with:
      msys2-runtime-artifact-name: install
    secrets: inherit
    permissions:
      contents: read
